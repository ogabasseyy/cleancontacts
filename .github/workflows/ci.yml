name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: set up JDK 21
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Lint
      run: ./gradlew :androidApp:lintDebug

    - name: Unit Test
      run: ./gradlew :androidApp:testDebugUnitTest

    - name: Build Debug APK
      run: ./gradlew :androidApp:assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: debug-apk
        path: androidApp/build/outputs/apk/debug/androidApp-debug.apk

  release-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up JDK 21
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Test release-quality verifier
      run: ./scripts/tests/verify-android-release-quality-test.sh

    - name: Build release AAB
      run: ./gradlew :androidApp:bundleRelease

    - name: Verify release optimization
      run: ./scripts/verify-android-release-quality.sh androidApp/build/outputs/bundle/release/androidApp-release.aab
