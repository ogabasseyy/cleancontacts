name: "CodeQL Advanced"

on:
  push:
    branches:
      - main
      - develop
      - "v*-release"
  pull_request:
    branches:
      - main
      - develop
      - "v*-release"
  schedule:
    - cron: '36 1 * * 6'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Java 25 (Project Standard)
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@45580472a5bb82c4681c4ac726cfdb60060c2ee1 # v3.32.4
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml
        # Use latest CodeQL CLI for Kotlin 2.3.x support (github/codeql#20661)
        tools: linked

    - name: Build (java-kotlin)
      if: matrix.build-mode == 'manual'
      # KSP may crash under CodeQL instrumentation until Kotlin 2.3.x support fully ships
      continue-on-error: true
      run: |
        chmod +x gradlew
        ./gradlew :androidApp:assembleDebug --no-daemon

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@45580472a5bb82c4681c4ac726cfdb60060c2ee1 # v3.32.4
      with:
        category: "/language:${{matrix.language}}"
