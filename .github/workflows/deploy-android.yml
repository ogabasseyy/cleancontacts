name: Deploy to Google Play

on:
  push:
    branches: [ "main" ]
    paths:
      - 'androidApp/**'
      - 'composeApp/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'production'
        type: choice
        options:
          - alpha
          - internal
          - beta
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-android-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up JDK 21
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Decode keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release-key.jks"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release AAB
      env:
        RELEASE_STORE_FILE: ${{ github.workspace }}/release-key.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        WHATSAPP_DETECTOR_API_KEY: ${{ secrets.WHATSAPP_DETECTOR_API_KEY }}
        WHATSAPP_DETECTOR_BASE_URL: ${{ secrets.WHATSAPP_DETECTOR_BASE_URL }}
      run: |
        VERSION_CODE=$((1000 + ${{ github.run_number }}))
        ./gradlew :androidApp:bundleRelease -PciVersionCode=$VERSION_CODE

    - name: Upload AAB artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-aab
        path: androidApp/build/outputs/bundle/release/androidApp-release.aab

    - name: Upload to Google Play
      uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.ogabassey.contactscleaner
        releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
        track: ${{ github.event_name == 'push' && 'production' || github.event.inputs.track || 'production' }}
        status: completed

    - name: Clean up keystore
      if: always()
      run: rm -f "$GITHUB_WORKSPACE/release-key.jks"
