name: Deploy to Google Play

on:
  push:
    branches: [ "main" ]
    paths:
      - 'androidApp/**'
      - 'composeApp/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

    - name: Set up JDK 21
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Decode keystore
      run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/release-key.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release AAB
      env:
        RELEASE_STORE_FILE: ${{ github.workspace }}/release-key.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        WHATSAPP_DETECTOR_API_KEY: ${{ secrets.WHATSAPP_DETECTOR_API_KEY }}
        WHATSAPP_DETECTOR_BASE_URL: ${{ secrets.WHATSAPP_DETECTOR_BASE_URL }}
      run: ./gradlew :androidApp:bundleRelease

    - name: Upload AAB artifact
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: release-aab
        path: androidApp/build/outputs/bundle/release/androidApp-release.aab

    - name: Upload to Google Play
      uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575b2f7571c4e3fc4 # v1.1.3
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.ogabassey.contactscleaner
        releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
        track: ${{ github.event.inputs.track || 'internal' }}
        status: completed

    - name: Clean up keystore
      if: always()
      run: rm -f $GITHUB_WORKSPACE/release-key.jks
