name: Deploy Web to Vercel

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/actionlint.yaml"
  pull_request:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/actionlint.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            web:
              - 'landing-page/**'
              - '.github/workflows/deploy-web.yml'
              - '.github/actionlint.yaml'

  deploy-production:
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.web == 'true'
    runs-on: cleancontacts-deploy
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: landing-page/package-lock.json

      - run: npm ci

      - run: npx vercel@50.13.2 pull --yes --environment=production --token="${{ env.VERCEL_TOKEN }}"

      - run: npx vercel@50.13.2 build --yes --prod --token="${{ env.VERCEL_TOKEN }}"

      - name: Deploy to Vercel (with retry)
        run: ../.github/scripts/deploy-with-retry.sh npx vercel@50.13.2 deploy --yes --prebuilt --prod --archive=tgz --token="${{ env.VERCEL_TOKEN }}"

  deploy-preview:
    needs: [changes]
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.web == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: cleancontacts-deploy
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: landing-page/package-lock.json

      - run: npm ci

      - run: npx vercel@50.13.2 pull --yes --environment=preview --token="${{ env.VERCEL_TOKEN }}"

      - run: npx vercel@50.13.2 build --yes --token="${{ env.VERCEL_TOKEN }}"

      - name: Deploy to Vercel (with retry)
        run: ../.github/scripts/deploy-with-retry.sh npx vercel@50.13.2 deploy --yes --prebuilt --archive=tgz --token="${{ env.VERCEL_TOKEN }}"
