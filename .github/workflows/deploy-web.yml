name: Deploy Web to VPS

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/scripts/deploy-static-site.sh"
      - ".github/actionlint.yaml"
  pull_request:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/scripts/deploy-static-site.sh"
      - ".github/actionlint.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            web:
              - 'landing-page/**'
              - '.github/workflows/deploy-web.yml'
              - '.github/scripts/deploy-static-site.sh'
              - '.github/actionlint.yaml'

  deploy-production:
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.web == 'true'
    runs-on: cleancontacts-deploy
    timeout-minutes: 20
    env:
      WEB_DEPLOY_DIR: /var/www/html/contactscleaner-tech
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: landing-page/package-lock.json

      - run: npm ci --prefix landing-page

      - run: npm run build --prefix landing-page

      - name: Publish static site to VPS webroot
        run: .github/scripts/deploy-static-site.sh landing-page/dist

      - name: Verify deployed files exist
        run: |
          test -f "${WEB_DEPLOY_DIR}/index.html"
          test -f "${WEB_DEPLOY_DIR}/.well-known/assetlinks.json"

  preview-build:
    needs: [changes]
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.web == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: cleancontacts-deploy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: landing-page/package-lock.json

      - run: npm ci --prefix landing-page

      - run: npm run build --prefix landing-page
