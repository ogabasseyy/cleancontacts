name: Deploy Web to VPS

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/scripts/deploy-static-site.sh"
      - ".github/actionlint.yaml"
  pull_request:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/scripts/deploy-static-site.sh"
      - ".github/actionlint.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            web:
              - 'landing-page/**'
              - '.github/workflows/deploy-web.yml'
              - '.github/scripts/deploy-static-site.sh'
              - '.github/actionlint.yaml'

  deploy-production:
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.web == 'true'
    runs-on: cleancontacts-deploy
    timeout-minutes: 20
    env:
      WEB_DEPLOY_DIR: /var/www/html/contactscleaner-tech
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: landing-page/package-lock.json

      - run: npm ci --prefix landing-page

      - run: npm run build --prefix landing-page

      - name: Publish static site to VPS webroot
        run: .github/scripts/deploy-static-site.sh landing-page/dist

      - name: Verify deployed files exist
        run: |
          test -f "${WEB_DEPLOY_DIR}/index.html"
          test -f "${WEB_DEPLOY_DIR}/.well-known/assetlinks.json"

  preview-build:
    needs: [changes]
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.web == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: cleancontacts-deploy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: landing-page/package-lock.json

      - run: npm ci --prefix landing-page

      - run: npm run build --prefix landing-page

      - name: Upload preview artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: landing-page-preview
          path: landing-page/dist
          retention-days: 7
