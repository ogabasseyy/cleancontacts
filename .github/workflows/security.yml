# Security Scanning Workflow
# Runs Semgrep and dependency vulnerability scanning

name: "Security"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  # Only cancel in-progress for PRs, allow scheduled/push scans to complete
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # Skip for forked PRs where SEMGREP_APP_TOKEN is not available
    # Forked PRs don't have access to secrets, which would cause Semgrep CI to fail
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      security-events: write

    container:
      # Pin to specific version for reproducibility
      image: semgrep/semgrep:1.104.0

    steps:
      - name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        id: semgrep
        run: semgrep ci --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Verify SARIF exists
        id: verify-sarif
        if: always()
        run: |
          if [ -s semgrep.sarif ]; then
            echo "sarif_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF file
        # Pin to full SHA for supply chain security
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always() && steps.verify-sarif.outputs.sarif_exists == 'true'
        with:
          sarif_file: semgrep.sarif

      - name: Fail if Semgrep reported issues
        if: steps.semgrep.outcome == 'failure'
        run: exit 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        # Pin to full SHA for supply chain security
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # 2026 best practice: use allow-licenses (deny-licenses is deprecated)
          # Allow permissive licenses + AGPL for TruffleHog security tool
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            Unlicense, CC0-1.0, WTFPL, Zlib, BlueOak-1.0.0,
            MPL-2.0, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            CC-BY-3.0, CC-BY-4.0, Python-2.0, PSF-2.0, Artistic-2.0

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        # Pin the wrapper to a full SHA and the scanner below to avoid its mutable latest default
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: --only-verified
